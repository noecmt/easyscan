<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title data-i18n="previewTitle">Easy Scan — Preview</title>
  <link rel="stylesheet" href="preview.css">
  <script type="module" src="preview.js"></script>
</head>
<body>
  <div class="header">
    <div class="title">
      <span class="icon" aria-hidden="true">&#x25A3;</span>
      <h1>Easy Scan</h1>
    </div>
    <div class="info" id="scanInfo">
      <span id="scanDate"></span>
      <span id="scanFormat"></span>
      <span id="scanSize"></span>
    </div>
  </div>

  <div class="container">
    <div class="preview-area">
      <div class="preview-wrapper" id="previewWrapper">
        <div class="loading" id="loadingIndicator">
          <div class="spinner"></div>
          <p data-i18n="loadingScan">Loading scan...</p>
        </div>

        <div class="preview-content" id="previewContent" style="display: none;">
          <img id="previewImage" data-i18n-alt="scanPreviewAlt" alt="Scan preview" />
          <div class="pdf-preview" id="pdfPreview" style="display: none;">
            <div class="pdf-icon">📄</div>
            <p data-i18n="documentPdf">Document PDF</p>
            <button id="openPdfBtn" class="btn btn-primary" data-i18n="openPdf">Open PDF</button>
          </div>
        </div>

        <div class="no-scan" id="noScanMessage" style="display: none;">
          <div class="no-scan-icon">📭</div>
          <h3 data-i18n="noScanAvailable">No scan available</h3>
          <p data-i18n="returnToPopup">Return to popup to perform a new scan</p>
          <button id="backToPopupBtn" class="btn btn-secondary" data-i18n="backToScanner">Back to scanner</button>
        </div>
      </div>
    </div>

    <div class="actions-panel">
      <div class="actions-group">
        <h3 data-i18n="actionsTitle">Actions</h3>
        <div class="buttons">
          <button id="saveBtn" class="btn btn-success" data-i18n-title="downloadTitle" data-i18n="download" title="Download scan">
            <span class="btn-icon">💾</span>
            Save
          </button>

          <button id="copyBtn" class="btn btn-info" data-i18n-title="copyTitle" data-i18n="copy" title="Copy to clipboard">
            <span class="btn-icon">📋</span>
            Copy
          </button>

          <button id="printBtn" class="btn btn-primary" data-i18n-title="printTitle" data-i18n="print" title="Print document">
            <span class="btn-icon">🖨️</span>
            Print
          </button>
        </div>
      </div>

      <div class="actions-group">
        <h3 data-i18n="navigationTitle">Navigation</h3>
        <div class="buttons">
          <button id="newScanBtn" class="btn btn-secondary" data-i18n-title="newScanTitle" data-i18n="newScan" title="Perform a new scan">
            <span class="btn-icon">🔄</span>
            New scan
          </button>

          <button id="closeBtn" class="btn btn-outline" data-i18n-title="closeTitle" data-i18n="close" title="Close this window">
            <span class="btn-icon">❌</span>
            Close
          </button>
        </div>
      </div>

      <div class="scan-history">
        <h3 data-i18n="history">History</h3>
        <div id="historyList" class="history-list"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <p data-i18n="footerText">Easy Scan extension — Direct network scanning from Chrome</p>
  </div>

  <div id="toast" class="toast">
    <span id="toastMessage"></span>
  </div>
</body>
</html>
