<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title data-i18n="optionsTitle">Easy Scan — Settings</title>
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
  <div class="container options-container">
    <h1 data-i18n="optionsTitle">Easy Scan — Settings</h1>

    <!-- My Scanners -->
    <section class="options-section">
      <h2 data-i18n="scanners">Scanners</h2>

      <ul id="scanner-list"></ul>

      <div id="add-scanner-form" class="hidden">
        <div class="field">
          <label for="new-scanner-ip">IP address</label>
          <input type="text" id="new-scanner-ip" placeholder="192.168.1.100">
        </div>
        <div class="field">
          <label for="new-scanner-name">Name</label>
          <input type="text" id="new-scanner-name" placeholder="My scanner">
        </div>
        <div class="add-scanner-actions">
          <button id="add-scanner-confirm-btn">Add</button>
          <button id="add-scanner-cancel-btn" class="btn-secondary">Cancel</button>
        </div>
      </div>

      <div class="scanner-actions-row">
        <button id="add-scanner-btn">+ Add scanner</button>
        <button id="discover-btn" class="btn-secondary">🔍 Discover on network</button>
      </div>

      <p id="discover-status" class="status"></p>
      <select id="discover-results" class="hidden">
        <option value="">Select a scanner…</option>
      </select>
      <div id="discover-name-row" class="discover-add-row hidden">
        <input type="text" id="discover-name-input" placeholder="Scanner name">
        <button id="discover-add-btn">Add</button>
      </div>
    </section>

    <!-- Default Settings -->
    <section class="options-section">
      <h2 data-i18n="defaultSettings">Default settings</h2>

      <div class="field">
        <label for="lang" data-i18n="languageLabel">Language</label>
        <select id="lang">
          <option value="auto" data-i18n="langAuto">Auto (browser)</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
        </select>
      </div>

      <div class="field">
        <label data-i18n="interfaceTheme">Interface theme</label>
        <div class="theme-selector" id="theme-selector">
          <button class="theme-option active" data-value="dark">
            <span class="theme-option-icon">☽</span>
            <span data-i18n="dark">Dark</span>
          </button>
          <button class="theme-option" data-value="light">
            <span class="theme-option-icon">☀</span>
            <span data-i18n="light">Light</span>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="dpi" data-i18n="resolution">Resolution</label>
        <select id="dpi">
          <option value="75">75 DPI</option>
          <option value="150">150 DPI</option>
          <option value="300" selected>300 DPI (standard)</option>
          <option value="600">600 DPI</option>
          <option value="1200">1200 DPI</option>
        </select>
      </div>

      <div class="field">
        <label for="colorMode" data-i18n="colorMode">Color mode</label>
        <select id="colorMode">
          <option value="RGB24" selected>Color</option>
          <option value="Grayscale8">Grayscale</option>
          <option value="BlackAndWhite1">Black &amp; White</option>
        </select>
      </div>

      <div class="field">
        <label for="format" data-i18n="outputFormat">Output format</label>
        <select id="format">
          <option value="jpeg" selected>JPEG (recommended)</option>
          <option value="png">PNG</option>
          <option value="pdf">PDF</option>
        </select>
      </div>

      <button id="reset-btn" class="reset-button" data-i18n="resetBtn">Reset</button>
      <p id="settings-status" class="status"></p>
    </section>

    <!-- About -->
    <section class="options-section">
      <h2 data-i18n="about">About</h2>
      <p>Easy Scan <span id="version"></span></p>
      <p class="about-desc" data-i18n="aboutDesc">Chrome extension for wireless scanning via eSCL/AirScan.</p>
    </section>
  </div>

  <script type="module" src="options.ts"></script>
</body>
</html>
